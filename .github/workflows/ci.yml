name: CI

on:
  push:
  pull_request:

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # Step 3: Install required tools
      - name: Install tooling
        run: npm install --no-save htmlhint lighthouse http-server

      # Step 4: Prepare report directory
      - name: Prepare report directory
        run: mkdir -p reports

      # Step 5: Lint all HTML files
      - name: Lint HTML with HTMLHint
        run: |
          set -o pipefail
          npx htmlhint "**/*.html" 2>&1 | tee reports/htmlhint-report.txt

      # Step 6: Run Lighthouse on all HTML files
      - name: Run Lighthouse on all HTML files
        run: |
          npx http-server -p 8080 &
          sleep 5
          for page in $(find . -name "*.html" ! -path "./node_modules/*" ! -path "./reports/*"); do
            echo "Testing $page"
            PAGE_URL="http://localhost:8080/${page#./}"
            REPORT_NAME=$(basename "$page" .html)
            npx lighthouse "$PAGE_URL" \
              --only-categories=performance,accessibility,seo \
              --chrome-flags="--headless" \
              --quiet \
              --output=json \
              --output=html \
              --output-path=reports/${REPORT_NAME}-lighthouse.html
          done

      # Step 7: Upload all reports
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: static-site-reports
          path: reports
