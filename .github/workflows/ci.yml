name: CI

on:
  push:
  pull_request:

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      # 3️⃣ Install tooling
      - name: Install tooling
        run: npm install --no-save htmlhint lighthouse

      # 4️⃣ Prepare reports directory
      - name: Prepare report directory
        run: mkdir -p reports

      # 5️⃣ Lint all HTML files
      - name: Lint HTML with HTMLHint
        run: |
          set -o pipefail
          npx htmlhint "**/*.html" 2>&1 | tee reports/htmlhint-report.txt || true

      # 6️⃣ Run Lighthouse on GitHub Pages URL
      - name: Run Lighthouse
        run: |
          TARGET_URL="https://mashael558.github.io/myDestination/"
          npx lighthouse "$TARGET_URL" \
            --only-categories=performance,accessibility,seo \
            --chrome-flags="--headless --disable-gpu" \
            --quiet \
            --output=html \
            --output-path=reports/lighthouse-report.html || true

      # 7️⃣ Upload all reports
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: reports/
